<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BimmerTech Pro — Vehicle Selector</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700;800&family=Barlow:wght@300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* Global NAV (consistent with other pages) */
.gnav{display:flex;align-items:center;gap:4px;background:var(--navy-800);border:1px solid var(--border);border-radius:5px;padding:4px}
.gnav a{display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:3px;text-decoration:none;
  font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:var(--dim);transition:all .2s;white-space:nowrap;border:1px solid transparent}
.gnav a:hover{color:var(--silver);background:var(--navy-700)}
.gnav a.active{color:var(--blue-bright);background:var(--blue-glow);border-color:var(--border-b)}
.gnav a .nav-icon{font-size:13px}
.gnav-divider{width:1px;height:20px;background:var(--border);margin:0 2px}

/* Core styles (cleaned and fixed from your version) */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy-900:#020b18;--navy-800:#071428;--navy-700:#0b1f3a;
  --blue-accent:#1a6bff;--blue-bright:#3d8bff;--blue-glow:#1a6bff33;
  --steel-light:#8ab4cc;--silver:#c8d8e8;--white:#eef4fb;
  --dim:#5d7d99;--gold:#d4a843;--success:#00c87a;--red:#e03030;
  --border:#1a3a5c;--border-bright:#1a6bff66;
}
html,body{height:100%;background:var(--navy-900);color:var(--silver);font-family:'Barlow',sans-serif;overflow-x:hidden}

/* Background & Header (same premium look) */
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 50% -10%,#0d2a5022 0%,transparent 70%),repeating-linear-gradient(90deg,transparent,transparent 79px,#1a3a5c18 80px),repeating-linear-gradient(0deg,transparent,transparent 79px,#1a3a5c18 80px);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--blue-accent),var(--gold),var(--blue-accent),transparent);z-index:100}

.page-wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:72px;background:linear-gradient(180deg,#071428ee,#071428aa);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}

/* Logo, Status, etc. – kept clean */
.logo-block{display:flex;align-items:center;gap:16px}
.logo-roundel{width:44px;height:44px;border-radius:50%;border:2px solid var(--blue-accent);background:conic-gradient(from 0deg,#0a0a0a 0deg,#0a0a0a 90deg,#fff 90deg,#fff 180deg,#0a0a0a 180deg,#0a0a0a 270deg,#fff 270deg,#fff 360deg);position:relative;box-shadow:0 0 16px var(--blue-glow)}
.logo-roundel::after{content:'';position:absolute;inset:4px;border-radius:50%;background:conic-gradient(from 0deg,#0055cc 0deg,#0055cc 90deg,#fff 90deg,#fff 180deg,#0055cc 180deg,#0055cc 270deg,#fff 270deg,#fff 360deg)}
.logo-text{display:flex;flex-direction:column;line-height:1}
.logo-main{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;letter-spacing:.12em;text-transform:uppercase;color:var(--white)}
.logo-sub{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.25em;color:var(--blue-bright);text-transform:uppercase}

.status-chip{display:flex;align-items:center;gap:8px;padding:6px 14px;border:1px solid #00c87a44;border-radius:4px;background:#00c87a0a;font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--success)}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--success);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

/* Main content, progress, panels, cards – your original styles preserved and fixed */
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:60px 24px 80px}
.page-title-block{text-align:center;margin-bottom:52px}
.page-title{font-family:'Barlow Condensed',sans-serif;font-size:52px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--white)}
.page-subtitle{font-size:15px;color:var(--dim);letter-spacing:.05em}

/* VIN Decoder specific styles */
.vin-section{margin-top:20px;padding:20px;background:var(--navy-800);border:1px solid var(--border);border-radius:8px}
.vin-input{display:flex;gap:10px}
.vin-input input{flex:1;background:var(--navy-900);border:1px solid var(--border);padding:12px 16px;color:var(--white);font-family:'Share Tech Mono',monospace;font-size:15px;border-radius:4px}
.vin-input button{padding:12px 24px;background:var(--blue-accent);color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:600}
.decode-result{margin-top:16px;padding:16px;background:var(--navy-900);border:1px solid var(--border);border-radius:6px;display:none}
.decode-result.show{display:block}
.decode-line{font-family:'Share Tech Mono',monospace;font-size:13px;margin:6px 0}
.decode-label{color:var(--dim);font-size:11px;letter-spacing:.1em}

/* Rest of your styles (progress, option-card, summary-card, etc.) remain here – copy from your previous version if needed */
</style>
</head>
<body>
<div class="page-wrap">

  <header>
    <div class="logo-block">
      <div class="logo-roundel"></div>
      <div class="logo-text">
        <span class="logo-main">BimmerTech Pro</span>
        <span class="logo-sub">Diagnostic & Repair Platform</span>
      </div>
    </div>
    <div class="header-right">
      <div class="status-chip">
        <div class="status-dot"></div>
        System Online
      </div>
      <nav class="gnav">
        <a href="index.html" class="active"><span class="nav-icon">🚗</span> Vehicle Select</a>
        <div class="gnav-divider"></div>
        <a href="labor-guide.html"><span class="nav-icon">📋</span> Labor Guide</a>
        <div class="gnav-divider"></div>
        <a href="fault-codes.html"><span class="nav-icon">⚡</span> Fault Codes</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-title-block">
      <div class="page-eyebrow">Vehicle Identification</div>
      <h1 class="page-title">Select Your <span>BMW</span></h1>
      <p class="page-subtitle">Choose series/model/year/engine or decode a VIN to load full repair data</p>
    </div>

    <!-- Progress Steps (unchanged) -->
    <div class="progress-track">...</div>  <!-- Keep your existing progress HTML -->

    <!-- Selector Panels (unchanged) -->
    <div class="selector-container">...</div>  <!-- Keep your existing panels and summary card -->

    <!-- New VIN Decoder Section (added below summary or integrated) -->
    <div class="vin-section" id="vinSection" style="max-width:780px;width:100%;margin-top:30px">
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;letter-spacing:.12em;color:var(--white);margin-bottom:12px">🔍 VIN Decoder</div>
      <div class="vin-input">
        <input type="text" id="vinInput" placeholder="Enter 17-character BMW VIN (e.g. WBA8E3C5X2GK503179)" maxlength="17" style="text-transform:uppercase">
        <button onclick="decodeVIN()">Decode VIN</button>
      </div>
      <div class="decode-result" id="decodeResult"></div>
    </div>
  </main>
</div>

<script>
// Your existing BMW_DATA object and all selection logic (renderSeries, selectSeries, etc.) go here unchanged

// ==================== VIN DECODER LOGIC ====================
const yearCodes = {
  'A':'2010','B':'2011','C':'2012','D':'2013','E':'2014','F':'2015','G':'2016','H':'2017',
  'J':'2018','K':'2019','L':'2020','M':'2021','N':'2022','P':'2023','R':'2024','S':'2025',
  'T':'2026','V':'2027','W':'2028','X':'2029','Y':'2030','1':'2001','2':'2002','3':'2003',
  '4':'2004','5':'2005','6':'2006','7':'2007','8':'2008','9':'2009'
};

const plantCodes = {
  'A':'Munich, Germany','B':'Dingolfing, Germany','C':'Dingolfing, Germany','D':'Berlin, Germany',
  'E':'Regensburg, Germany','F':'Spartanburg, USA','G':'Spartanburg, USA','H':'Toluca, Mexico',
  'J':'Hamm, Germany','K':'Munich, Germany','L':'Landsberg, Germany','M':'Munich, Germany',
  'N':'Oxford, UK','P':'Leipzig, Germany','R':'Goodwood, UK','S':'Shenyang, China',
  'U':'Spartanburg, USA','W':'Graz, Austria','X':'Spartanburg, USA','0':'BMW Plant (various)'
};

function decodeVIN() {
  let vin = document.getElementById('vinInput').value.trim().toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g,'');
  const resultDiv = document.getElementById('decodeResult');
  
  if (vin.length !== 17) {
    resultDiv.innerHTML = `<div style="color:var(--red)">Invalid VIN: Must be exactly 17 characters.</div>`;
    resultDiv.classList.add('show');
    return;
  }

  // Basic decoding
  const wmi = vin.substring(0,3);
  const vds = vin.substring(3,9);
  const checkDigit = vin[8];
  const modelYearChar = vin[9];
  const plant = vin[10];
  const serial = vin.substring(11);

  const modelYear = yearCodes[modelYearChar] || 'Unknown (' + modelYearChar + ')';
  const assemblyPlant = plantCodes[plant] || 'Unknown Plant (' + plant + ')';

  let html = `
    <div style="color:var(--gold);font-weight:700;margin-bottom:10px">VIN Decoded Successfully</div>
    <div class="decode-line"><span class="decode-label">WMI (Country/Manufacturer):</span> ${wmi} (BMW AG, Germany)</div>
    <div class="decode-line"><span class="decode-label">Model Year:</span> ${modelYear}</div>
    <div class="decode-line"><span class="decode-label">Assembly Plant:</span> ${assemblyPlant}</div>
    <div class="decode-line"><span class="decode-label">Serial Number:</span> ${serial}</div>
    <div class="decode-line"><span class="decode-label">VDS (Attributes):</span> ${vds}</div>
    <button onclick="useDecodedVIN('${vin}')" style="margin-top:16px;padding:10px 20px;background:var(--blue-accent);color:#fff;border:none;border-radius:4px;cursor:pointer">Use This Vehicle in Selector</button>
  `;

  resultDiv.innerHTML = html;
  resultDiv.classList.add('show');

  // Optional: Auto-suggest matching selector if year matches
}

function useDecodedVIN(vin) {
  alert(`VIN ${vin} loaded.\n\nYou can now manually select the closest matching vehicle in the selector or use Labor Guide / Fault Codes with this context.`);
  // In a full merged app, you could auto-populate state.year, etc.
}

// Keep all your existing init(), render functions, loadRepairData(), resetAll(), etc.
init();
</script>
</body>
</html>
